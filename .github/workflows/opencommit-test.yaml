name: OpenCommit test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  opencommit:
    name: Generate commit with OpenCommit
    runs-on: self-hosted
    timeout-minutes: 10

    env:
      OCO_AI_PROVIDER: ollama
      OCO_API_URL: http://127.0.0.1:11434
      OCO_MODEL: gemma4:12b

      OCO_TOKENS_MAX_INPUT: 32768
      OCO_TOKENS_MAX_OUTPUT: 500

      OCO_LANGUAGE: es_ES
      OCO_ONE_LINE_COMMIT: true
      OCO_OLLAMA_THINK: false
      OCO_GITPUSH: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenCommit
        run: npm install --global opencommit@3.3.10

      - name: Check Ollama
        run: |
          curl --fail --silent \
            http://127.0.0.1:11434/api/tags \
            >/dev/null

          echo "Ollama disponible"

      - name: Prepare test branch
        run: |
          git fetch origin opencommit-test || true

          if git show-ref \
            --verify \
            --quiet refs/remotes/origin/opencommit-test; then
            git switch --force-create \
              opencommit-test \
              origin/opencommit-test
          else
            git switch --create opencommit-test
          fi

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create test change
        run: |
          cat > .opencommit-test.txt <<EOF
          OpenCommit GitHub Actions test

          Run: $GITHUB_RUN_NUMBER
          Run ID: $GITHUB_RUN_ID
          Commit: $GITHUB_SHA
          EOF

          git add .opencommit-test.txt

          echo "Diff que recibirá OpenCommit:"
          git diff --cached

      - name: Commit with OpenCommit
        run: |
          oco --yes --no-verify

      - name: Show generated commit
        run: |
          echo "Commit generado por OpenCommit:"
          git log -1 \
            --pretty=format:'%h %s'

      - name: Push test commit
        run: |
          git push origin HEAD:opencommit-test